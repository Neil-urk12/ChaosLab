apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: chaoslab-postgres-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: chaoslab-backend-keys
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: chaoslab-stack
  labels:
    app: chaoslab
spec:
  containers:
    - name: postgres
      image: docker.io/library/postgres:17-alpine
      env:
        - name: POSTGRES_DB
          value: chaos_db
        - name: POSTGRES_USER
          value: postgres
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: chaoslab-secret
              key: postgres-password
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
      volumeMounts:
        - name: postgres-storage
          mountPath: /var/lib/postgresql/data
      ports:
        - containerPort: 5432
          hostPort: 5432
          # Loopback only, so the dev database and API are not reachable from the LAN.
          hostIP: 127.0.0.1

    - name: backend
      image: ${IMAGE_NAME}
      env:
        - name: ASPNETCORE_ENVIRONMENT
          value: Development
        - name: ASPNETCORE_HTTP_PORTS
          value: "8080"
        - name: ConnectionStrings__DefaultConnection
          valueFrom:
            secretKeyRef:
              name: chaoslab-secret
              key: connection-string
        # Optional so older secret.yaml files still start; secret credentials and secret header values cannot be saved or used until it is set.
        - name: Credentials__Key
          valueFrom:
            secretKeyRef:
              name: chaoslab-secret
              key: credentials-key
              optional: true
      # Data Protection keys sign login cookies and refresh tokens; without a volume every pod recreation
      # (make restart) loses them and signs everyone out.
      volumeMounts:
        - name: backend-keys
          mountPath: /home/app/.aspnet/DataProtection-Keys
      ports:
        - containerPort: 8080
          hostPort: 8080
          hostIP: 127.0.0.1

  volumes:
    - name: postgres-storage
      persistentVolumeClaim:
        claimName: chaoslab-postgres-data
    - name: backend-keys
      persistentVolumeClaim:
        claimName: chaoslab-backend-keys
