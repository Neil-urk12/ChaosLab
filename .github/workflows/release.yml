name: Release image

# A version tag (v0.1.0) publishes ghcr.io/<owner>/chaoslab:0.1.0 for amd64 and arm64 and moves `latest`
# (FeaturesFlow 2.0). A pre-release tag (v0.1.0-rc.1) publishes its version without moving `latest`.
# The image is published only after the backend tests and the frontend check and unit tests pass.
# GHCR makes a new package private: after the first release, set its visibility to Public once in the package
# settings, or `docker compose pull` fails for everyone else.
# After tagging, bump `release` in Website/src/lib/site.ts, so the site installs the new compose.yaml.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      # Testcontainers starts PostgreSQL on the runner's Docker (Backend.Tests/README.md).
      - run: dotnet test Backend/Backend.sln
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: Frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: Frontend
      - run: pnpm run check
        working-directory: Frontend
      - run: pnpm run test:unit -- --run
        working-directory: Frontend

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      # Only the base stage's mkdir runs emulated on arm64; the SDK stages run natively (Backend/Dockerfile).
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/chaoslab
          tags: type=semver,pattern={{version}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
